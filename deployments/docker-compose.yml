version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issuesight}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: backend/gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # Override for Docker networking - credentials from .env
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-issuesight}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - COLLECTOR_URL=http://collector:8081
      - CONCEPTS_AUTO_SEED=true
      # Relaxed limits for testing (re-enforce in production: RATE_LIMIT_REQUESTS=60, QUOTA_DAILY_LIMIT=10)
      - RATE_LIMIT_REQUESTS=0
      - QUOTA_DAILY_LIMIT=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    build:
      context: ..
      dockerfile: backend/collector/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8081
    depends_on:
      redis:
        condition: service_healthy

  ai-processor:
    build:
      context: ..
      dockerfile: backend/ai-processor/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      # Override for Docker networking - credentials from .env
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-issuesight}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
